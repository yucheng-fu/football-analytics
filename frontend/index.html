<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pitch</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="app-container">
    <div id="pitch-container">
      <svg id="canvas"></svg>
      <p class="status-text api-note">
        <span id="api-status">Checking API…</span>
        The API sleeps when idle. <a href="https://yuch0001-football-api.hf.space/docs#/" target="_blank" rel="noopener">Open the API docs</a> to wake it (can take ~1 min).
      </p>
      <a class="github-link" href="https://github.com/yucheng-fu/football_analytics" target="_blank" rel="noopener" aria-label="Source code on GitHub" title="Source code on GitHub">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
    </div>

    <aside id="sidebar">
      <div class="sidebar-header">
        <h3>Drawn Plays</h3>
        <div class="probability-legend">
          <div class="legend-title">Predicted Success Probability</div>
          <div class="legend-bar" aria-hidden="true"></div>
          <div class="legend-ticks">
            <span>0.0</span>
            <span>0.5</span>
            <span>1.0</span>
          </div>
        </div>
      </div>
      <div id="menu-list-wrapper">
        <div id="menu-list"></div>
      </div>
      <div id="pagination-controls"></div>

      <div class="sidebar-footer">
        <button id="btn-clear-all" class="btn-danger-outline">Clear All Plays</button>
      </div>
    </aside>

    <div id="edit-panel">
      <div class="panel-header">
        <h4>Properties</h4>
        <button id="close-panel">&times;</button>
      </div>
      
      <div class="input-group">
        <label>Height</label>
        <select id="input-height">
          <option value="Ground pass">Ground pass</option>
          <option value="Low pass">Low pass</option>
          <option value="High pass">High pass</option>
        </select>
      </div>

      <div class="input-group">
        <label>Body Part</label>
        <select id="input-bodypart">
          <option value="Right foot">Right foot</option>
          <option value="Left foot">Left foot</option>
          <option value="Head">Head</option>
          <option value="Keeper arm">Keeper arm</option>
          <option value="Drop kick">Drop kick</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="input-group checkbox-group">
        <input type="checkbox" id="input-pressure">
        <label for="input-pressure">Under Pressure</label>
      </div>

      <div class="input-group">
        <div class="label-row">
          <label>Duration (seconds)</label>
          <span id="duration-val">1.0</span>
        </div>
        <input type="range" id="input-duration" min="0.5" max="10" step="0.1" value="1.0">
      </div>

      <div class="panel-footer">
        <button id="btn-delete-active" class="btn-danger">Delete Pass</button>
        <button id="btn-predict-active" class="btn-primary">Predict Pass Success</button>
        <p id="prediction-status" class="status-text"></p>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.ts"></script>
</body>
</html>
